<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b20">
  <meta name="color-scheme" content="dark">
  <title>Chris’ Logbook</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script type="module" src="main.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#screen">Skip to content</a>
  <div class="app-shell">
    <header class="app-header"><a class="wordmark" href="#today">Chris’ Logbook</a><button class="text-button" data-action="settings">Settings</button></header>
    <main id="screen" tabindex="-1"><p role="status">Opening your logbook…</p></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-11 5h6"/></svg>Today</a>
      <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24"><path d="M4 4v16h17M7 14l4-4 4 2 5-7"/></svg>Trends</a>
      <a href="#sunday" data-tab="sunday"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>Sunday</a>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-header"><h2 id="sheet-title" tabindex="-1"></h2><button class="text-button" id="close-sheet">Cancel</button></div><div id="sheet-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
