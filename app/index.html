<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b20">
  <meta name="color-scheme" content="dark">
  <title>Road to the Stage</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Road to the Stage">

<body>
  <a class="skip-link" href="#screen">Skip to content</a>
  <div class="app-shell">

    <main id="screen" tabindex="-1"><p role="status">Opening your logbook…</p></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="#nutrition" data-tab="nutrition">Nutrition</a>
      <a href="#training" data-tab="training">Training</a>
      <a href="#checkin" data-tab="checkin">Check-in</a>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-header"><button type="button" id="sheet-back" class="sheet-back" hidden>‹</button><h2 id="sheet-title" tabindex="-1"></h2><button class="text-button" id="close-sheet">Cancel</button></div><div id="sheet-content"></div><div id="sheet-footer" hidden></div></dialog>
  <div id="toast" role="status" hidden></div>
